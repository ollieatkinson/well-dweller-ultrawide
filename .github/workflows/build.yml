name: Build

on:
  push:
    branches: [trunk]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fetch dependencies
        run: cmake -S . -B build
      - name: Package
        run: cmake --build build --target package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: downloads
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: downloads
          path: dist
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256
          --verify-tag --title "$RELEASE_TAG — SUWSF ultrawide"
          --notes 'Extract beside WellDweller.exe and select 3440×1440 or 5120×2160. When updating, replace all bundled files together. Restore the original executable first if you used the old executable patch. Proton: WINEDLLOVERRIDES="version=n,b" %command%. Bundles SUWSF v2.3.0-guard.3 with executable SHA-256 verification and atomic validation of every patch pattern before any writes. Incompatible versions or configurations display a warning and continue without the fixes; see SUWSF.log. Remove version.dll, SUWSF.asi, SUWSF.ini and the WellDwellerUltrawide documentation folder to uninstall. Targets Steam build 25633433. Original game files and saves are unchanged.'
